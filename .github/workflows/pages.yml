# Deploys the page to GitHub Pages on every push to main.
# GitHub Pages lets browsers keep each file for 10 minutes: the stylesheets and the script get the commit
# in their URL, so a new version of either is loaded at once. The repository itself keeps the plain links.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy the page and version its stylesheets and script
        run: |
          version="${GITHUB_SHA::8}"
          mkdir _site
          cp -r index.html typographic-grid *.js _site/
          # every local stylesheet and script: a relative href or src (no scheme) ending in .css or .js
          sed -i -E "s#(href|src)=\"([^\":?\#]+\.(css|js))\"#\1=\"\2?v=$version\"#g" _site/index.html
          # stop if a file that ships isn't linked with the version: the page would load a stale one, or none
          for file in typographic-grid/*.css *.js; do
            grep -q "=\"$file?v=$version\"" _site/index.html || { echo "not versioned: $file"; exit 1; }
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
