# Deploys the page to GitHub Pages on every push to main.
# GitHub Pages lets browsers keep each file for 10 minutes: the stylesheet and the script get the commit
# in their URL, so a new version of either is loaded at once. The repository itself keeps the plain links.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy the page and version its stylesheet and script
        run: |
          version="${GITHUB_SHA::8}"
          mkdir _site
          cp index.html typographic-grid.css typographic-grid.js _site/
          sed -i \
            -e "s|href=\"typographic-grid.css\"|href=\"typographic-grid.css?v=$version\"|" \
            -e "s|src=\"typographic-grid.js\"|src=\"typographic-grid.js?v=$version\"|" \
            _site/index.html
          # stop if a link wasn't found: the page would deploy without the versions
          test "$(grep -c "?v=$version" _site/index.html)" -eq 2

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
